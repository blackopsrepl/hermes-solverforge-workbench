<!doctype html>
<!-- Architecture of the plugin, drawn from __init__.py, tools.py, service.py, store.py, worker.py,
     custom.py, engine_bin.py, desktop/plugin.js, dashboard/plugin_api.py and engine/. Render: make images -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1600px; height: 1000px; overflow: hidden; background: #04140c; }
  svg { display: block; }
  .kicker { font: 500 17px "Fira Code"; letter-spacing: 0.14em; fill: #4ade80; }
  .title { font: 700 40px "Fira Sans"; fill: #ecfdf5; }
  .sub { font: 400 19px "Fira Sans"; fill: #bbf7d0; }
  .lane { fill: rgba(34, 197, 94, 0.035); stroke: rgba(74, 222, 128, 0.28); stroke-dasharray: 6 6; }
  .lanelabel { font: 500 15px "Fira Code"; letter-spacing: 0.12em; fill: #4ade80; }
  .node { fill: #072417; stroke: #22c55e; stroke-width: 1.5; }
  .engine { fill: #0b3320; stroke: #4ade80; stroke-width: 2.5; }
  .ext { fill: #0a1a14; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 4; }
  .h { font: 600 19px "Fira Sans"; fill: #ecfdf5; }
  .t { font: 400 14.5px "Fira Sans"; fill: #a7f3d0; }
  .m { font: 400 13.5px "Fira Code"; fill: #a7f3d0; }
  .xt { font: 400 14.5px "Fira Sans"; fill: #cbd5e1; }
  .edge { stroke: #4ade80; stroke-width: 2; fill: none; }
  .xedge { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
  .el { font: 400 13.5px "Fira Code"; fill: #86efac; }
  .xel { font: 400 13.5px "Fira Code"; fill: #cbd5e1; }
  .badge { fill: #4ade80; }
  .bn { font: 700 15px "Fira Code"; fill: #04140c; }
  .step { font: 600 16px "Fira Sans"; fill: #ecfdf5; }
  .stept { font: 400 14px "Fira Sans"; fill: #a7f3d0; }
</style>
</head>
<body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/>
    </marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Header -->
  <text class="kicker" x="40" y="58">ARCHITECTURE</text>
  <text class="title" x="40" y="102">SolverForge Workbench for Hermes</text>
  <text class="sub" x="40" y="132">The engine plans and scores. The plugin keeps every dataset, profile and run. Hermes and the page are how you drive it.</text>

  <!-- Lanes -->
  <rect class="lane" x="40" y="160" width="260" height="560" rx="10"/>
  <text class="lanelabel" x="60" y="188">YOU</text>
  <rect class="lane" x="330" y="160" width="400" height="560" rx="10"/>
  <text class="lanelabel" x="350" y="188">HERMES</text>
  <rect class="lane" x="760" y="160" width="410" height="560" rx="10"/>
  <text class="lanelabel" x="780" y="188">PLUGIN · PYTHON</text>
  <rect class="lane" x="1200" y="160" width="360" height="560" rx="10"/>
  <text class="lanelabel" x="1220" y="188">ENGINE · RUST</text>

  <!-- YOU -->
  <rect class="node" x="60" y="210" width="220" height="80" rx="8"/>
  <text class="h" x="76" y="240">Chat</text>
  <text class="t" x="76" y="266">"Ines is off on Wednesday.</text>
  <text class="t" x="76" y="284">Replan the roster."</text>

  <rect class="node" x="60" y="560" width="220" height="80" rx="8"/>
  <text class="h" x="76" y="590">Workbench page</text>
  <text class="t" x="76" y="616">Data, profiles, runs, map,</text>
  <text class="t" x="76" y="634">experiments, trends</text>

  <!-- HERMES -->
  <rect class="node" x="360" y="210" width="340" height="80" rx="8"/>
  <text class="h" x="376" y="240">Agent</text>
  <text class="t" x="376" y="266">Follows the workbench skill and explains</text>
  <text class="t" x="376" y="284">each run from its matches</text>

  <rect class="node" x="360" y="470" width="340" height="80" rx="8"/>
  <text class="h" x="376" y="500">Your solverforge-cli project</text>
  <text class="t" x="376" y="526">registered as a model of your own,</text>
  <text class="t" x="376" y="544">built with cargo</text>

  <!-- PLUGIN -->
  <rect class="node" x="790" y="210" width="350" height="80" rx="8"/>
  <text class="h" x="806" y="240">37 solverforge_workbench_* tools</text>
  <text class="t" x="806" y="266">datasets, profiles, solve, explain,</text>
  <text class="t" x="806" y="284">fill, replan, compare, experiments</text>

  <rect class="node" x="790" y="340" width="350" height="84" rx="8"/>
  <text class="h" x="806" y="370">Workbench database</text>
  <text class="m" x="806" y="394">SQLite: models, datasets, profiles,</text>
  <text class="m" x="806" y="414">runs, experiments, builds</text>

  <rect class="node" x="790" y="450" width="350" height="70" rx="8"/>
  <text class="h" x="806" y="480">Solve worker</text>
  <text class="t" x="806" y="504">detached; outlives the chat turn</text>

  <rect class="node" x="790" y="560" width="350" height="80" rx="8"/>
  <text class="h" x="806" y="590">Desktop API</text>
  <text class="m" x="806" y="616">/api/plugins/solverforge-workbench</text>
  <text class="t" x="806" y="634">same database, same engine</text>

  <!-- ENGINE -->
  <rect class="engine" x="1230" y="210" width="300" height="150" rx="8"/>
  <text class="h" x="1246" y="240">solverforge-workbench</text>
  <text class="t" x="1246" y="266">SolverForge, one process per request</text>
  <text class="t" x="1246" y="288">4 stock models, 244 rules</text>
  <text class="t" x="1246" y="310">describe, demo, evaluate, solve,</text>
  <text class="t" x="1246" y="330">explain, fill, edit, view</text>
  <text class="t" x="1246" y="350">No credentials, no settings</text>

  <rect class="node" x="1230" y="400" width="300" height="120" rx="8"/>
  <text class="h" x="1246" y="430">Road cache</text>
  <text class="t" x="1246" y="456">solverforge-maps networks, one</text>
  <text class="t" x="1246" y="476">per area, for the routing models</text>
  <text class="t" x="1246" y="502">travel measured along the roads</text>

  <!-- External -->
  <rect class="ext" x="790" y="760" width="350" height="80" rx="8"/>
  <text class="h" x="806" y="790">OpenStreetMap</text>
  <text class="xt" x="806" y="816">an area's roads, the first time it is used</text>

  <rect class="ext" x="1230" y="760" width="300" height="80" rx="8"/>
  <text class="h" x="1246" y="790">GitHub release engine-v0.2.0</text>
  <text class="xt" x="1246" y="816">built by CI, build attestation</text>

  <!-- Edges -->
  <path class="edge" d="M280,250 L356,250" marker-end="url(#a)"/>

  <path class="edge" d="M700,236 L786,236" marker-end="url(#a)"/>
  <path class="edge" d="M790,268 L704,268" marker-end="url(#a)"/>

  <path class="edge" d="M1140,232 L1226,232" marker-end="url(#a)"/>
  <text class="el" x="1150" y="224">plan</text>
  <path class="edge" d="M1230,272 L1144,272" marker-end="url(#a)"/>
  <text class="el" x="1150" y="292">score</text>

  <path class="edge" d="M965,290 L965,336" marker-end="url(#a)"/>
  <path class="edge" d="M965,424 L965,446" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="edge" d="M1140,485 L1180,485 L1180,320 L1226,320" marker-end="url(#a)"/>

  <path class="edge" d="M700,500 L745,500 L745,400 L786,400" marker-end="url(#a)"/>
  <text class="el" x="636" y="462">register</text>

  <path class="edge" d="M280,600 L786,600" marker-end="url(#a)"/>
  <path class="edge" d="M1140,600 L1162,600 L1162,382 L1144,382" marker-end="url(#a)"/>

  <path class="edge" d="M1380,360 L1380,396" marker-end="url(#a)"/>
  <path class="xedge" d="M1140,800 L1210,800 L1210,500 L1226,500" marker-end="url(#ax)"/>
  <path class="xedge" d="M1545,760 L1545,300 L1534,300" marker-end="url(#ax)"/>
  <text class="xel" x="1250" y="740">on install: SHA-256 pinned</text>

  <!-- Numbered steps on the edges -->
  <circle class="badge" cx="318" cy="228" r="13"/><text class="bn" x="313" y="233">1</text>
  <circle class="badge" cx="743" cy="218" r="13"/><text class="bn" x="738" y="223">2</text>
  <circle class="badge" cx="1185" cy="252" r="13"/><text class="bn" x="1180" y="257">3</text>
  <circle class="badge" cx="745" cy="290" r="13"/><text class="bn" x="740" y="295">4</text>
  <circle class="badge" cx="530" cy="620" r="13"/><text class="bn" x="525" y="625">5</text>

  <!-- Steps -->
  <circle class="badge" cx="56" cy="896" r="13"/><text class="bn" x="51" y="901">1</text>
  <text class="step" x="80" y="901">Pick</text>
  <text class="stept" x="80" y="924">A model and a dataset: a demo,</text>
  <text class="stept" x="80" y="944">a file, or JSON in the chat</text>

  <circle class="badge" cx="356" cy="896" r="13"/><text class="bn" x="351" y="901">2</text>
  <text class="step" x="380" y="901">Tune</text>
  <text class="stept" x="380" y="924">Weights, parameters and solve</text>
  <text class="stept" x="380" y="944">settings, kept as profiles</text>

  <circle class="badge" cx="656" cy="896" r="13"/><text class="bn" x="651" y="901">3</text>
  <text class="step" x="680" y="901">Solve</text>
  <text class="stept" x="680" y="924">In the background; stopping</text>
  <text class="stept" x="680" y="944">keeps the best plan found</text>

  <circle class="badge" cx="956" cy="896" r="13"/><text class="bn" x="951" y="901">4</text>
  <text class="step" x="980" y="901">Explain</text>
  <text class="stept" x="980" y="924">Which rule cost what,</text>
  <text class="stept" x="980" y="944">and the records it blames</text>

  <circle class="badge" cx="1256" cy="896" r="13"/><text class="bn" x="1250" y="901">5</text>
  <text class="step" x="1280" y="901">Replan and compare</text>
  <text class="stept" x="1280" y="924">Change the data, solve again,</text>
  <text class="stept" x="1280" y="944">and set the runs side by side</text>
</svg>
</body>
</html>
