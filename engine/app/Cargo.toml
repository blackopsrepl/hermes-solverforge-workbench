[package]
name = "solverforge-workbench"
version = "0.1.0"
description = "The SolverForge Workbench engine: every stock model behind one JSON Lines contract"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "solverforge-workbench"
path = "src/main.rs"

[dependencies]
solverforge-workbench-host = { path = "../host" }
solverforge-workbench-employee-scheduling = { path = "../models/employee-scheduling" }
solverforge-workbench-task-scheduling = { path = "../models/task-scheduling" }
solverforge-workbench-pickup-delivery-routing = { path = "../models/pickup-delivery-routing" }
solverforge-workbench-field-service-routing = { path = "../models/field-service-routing" }
