[termination]
seconds_spent_limit = 30

# Roster the crews first: coverage asks for them before any load exists.
[[phases]]
type = "construction_heuristic"
construction_heuristic_type = "cheapest_insertion"
entity_class = "RosterDay"

# Place each order with its crew, most urgent first.
[[phases]]
type = "construction_heuristic"
construction_heuristic_type = "cheapest_insertion"
construction_obligation = "preserve_unassigned"
group_name = "placement"
value_candidate_limit = 24

[[phases]]
type = "local_search"

[phases.acceptor]
type = "late_acceptance"
late_acceptance_size = 400

[phases.forager]
type = "accepted_count"
limit = 16

[phases.move_selector]
type = "union_move_selector"

[[phases.move_selector.selectors]]
type = "grouped_scalar_move_selector"
group_name = "placement"
value_candidate_limit = 6
max_moves_per_step = 96

[[phases.move_selector.selectors]]
type = "grouped_scalar_move_selector"
group_name = "crew"
max_moves_per_step = 32

[[phases.move_selector.selectors]]
type = "change_move_selector"
entity_class = "RosterDay"

[[phases.move_selector.selectors]]
type = "swap_move_selector"
entity_class = "RosterDay"

[[phases.move_selector.selectors]]
type = "change_move_selector"
entity_class = "WorkOrder"
variable_name = "program_op"

[[phases.move_selector.selectors]]
type = "swap_move_selector"
entity_class = "WorkOrder"
