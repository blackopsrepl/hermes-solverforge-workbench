[termination]
seconds_spent_limit = 30

[[phases]]
type = "construction_heuristic"
construction_heuristic_type = "first_fit"

[[phases]]
type = "local_search"

[phases.acceptor]
type = "late_acceptance"
late_acceptance_size = 400

# Each step takes the best of 16 accepted moves. Taking the first one let late
# acceptance wander: while medium work was still being filled, nearly any soft
# regression passed, published shifts included. On the hospital month this is
# about 35% better soft score in the same time; at 64 the gain stops and at 256
# steps get too slow to finish the medium work.
[phases.forager]
type = "accepted_count"
limit = 16

[phases.move_selector]
type = "union_move_selector"

[[phases.move_selector.selectors]]
type = "change_move_selector"

[[phases.move_selector.selectors]]
type = "swap_move_selector"

# Unassigning is the last candidate the change selector offers per shift, so
# with the first accepted move taken it is rarely reached. Capped at one
# employee per shift, this selector offers the unassign move every other
# time, which optional shifts, alternatives and over-full days need.
[[phases.move_selector.selectors]]
type = "change_move_selector"
value_candidate_limit = 1
