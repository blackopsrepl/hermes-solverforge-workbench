[workspace]
resolver = "2"
members = ["app", "host", "testkit", "models/*"]

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/blackopsrepl/hermes-solverforge-workbench"
publish = false

[workspace.dependencies]
solverforge = { version = "=0.29.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
