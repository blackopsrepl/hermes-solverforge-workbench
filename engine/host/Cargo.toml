[package]
name = "solverforge-workbench-host"
version = "0.1.0"
description = "Runs any SolverForge model behind the workbench engine contract: JSON request on stdin, JSON Lines events on stdout"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
solverforge.workspace = true
solverforge-scoring.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
# Road networks, snapping, travel along the roads and route geometry.
solverforge-maps = "=2.3.3"
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
