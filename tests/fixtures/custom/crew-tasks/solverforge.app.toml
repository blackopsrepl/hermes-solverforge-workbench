scalar_groups = []
conflict_repairs = []

[app]
name = "crew-tasks"
starter = "neutral-shell"
shell = "cli"
cli_version = "4.0.4"

[runtime]
target = "solverforge 0.31.1"
runtime_source = "crates.io: solverforge 0.31.1"

[demo]
default_size = "standard"
available_sizes = [
    "small",
    "standard",
    "large",
]

[solution]
name = "Plan"
score = "HardSoftScore"
scalar_groups_path = ""
conflict_repairs_path = ""

[[facts]]
name = "resource"
plural = "resources"
kind = "problem_fact"

[[entities]]
name = "task"
plural = "tasks"
kind = "planning_entity"

[[variables]]
entity = "task"
entity_plural = "tasks"
field = "resource_idx"
kind = "scalar"
range = "resources"
elements = ""
allows_unassigned = true
enabled = true

[[constraints]]
name = "assign_every_task"
module = "assign_every_task"
enabled = true

[[constraints]]
name = "skill_match"
module = "skill_match"
enabled = true

[[constraints]]
name = "spread_hours"
module = "spread_hours"
enabled = true
