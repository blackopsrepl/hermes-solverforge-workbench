manifest_version: 2
name: solverforge-workbench
version: 0.1.0
label: SolverForge Workbench
description: >
  Optimization models you can configure, solve and build, on your own machine.
  Stock models for employee scheduling, field service routing, pick-up and
  delivery and task scheduling run on a SolverForge engine; tune constraint
  weights and solve settings in profiles, solve datasets in the background,
  read why every constraint fired, replan from a patch, and compare runs.
  No account, no network access while solving.
author: blackopsrepl
license: Apache-2.0
homepage: https://github.com/blackopsrepl/hermes-solverforge-workbench
requires_hermes: ">=0.22.2"
tags: [optimization, scheduling, routing, solver, solverforge, planning]
provides_tools:
  - solverforge_workbench_status
  - solverforge_workbench_models
  - solverforge_workbench_model
  - solverforge_workbench_model_register
  - solverforge_workbench_model_remove
  - solverforge_workbench_dataset_create
  - solverforge_workbench_dataset_check
  - solverforge_workbench_datasets
  - solverforge_workbench_dataset
  - solverforge_workbench_dataset_update
  - solverforge_workbench_dataset_patch
  - solverforge_workbench_dataset_delete
  - solverforge_workbench_profile_save
  - solverforge_workbench_profile_default
  - solverforge_workbench_profile_delete
  - solverforge_workbench_profile_export
  - solverforge_workbench_profile_import
  - solverforge_workbench_solve
  - solverforge_workbench_evaluate
  - solverforge_workbench_run
  - solverforge_workbench_runs
  - solverforge_workbench_run_update
  - solverforge_workbench_cancel
  - solverforge_workbench_explain
  - solverforge_workbench_fill
  - solverforge_workbench_fill_apply
  - solverforge_workbench_experiment_create
  - solverforge_workbench_experiment
  - solverforge_workbench_experiments
  - solverforge_workbench_experiment_cancel
  - solverforge_workbench_experiment_delete
  - solverforge_workbench_trends
  - solverforge_workbench_compare
  - solverforge_workbench_export
provides_hooks:
  - pre_tool_call
config_schema:
  binary:
    type: str
    default: ""
    label: Engine binary path
    description: Leave empty to use the engine installed by `hermes solverforge-workbench install`.
  parallel_solves:
    type: int
    default: 0
    label: Solves at once
    description: How many solves run at the same time; 0 picks a quarter of this machine's cores.
